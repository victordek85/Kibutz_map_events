<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<!-- app version: the single source of truth. Change it only with tools/release.py -->
<meta name="app-version" content="0.0.0">
<!-- which kibbutz to open when the URL has no ?k= (a per-kibbutz deployment sets this) -->
<meta name="kmap-default" content="">
<!-- "1" = also load the phase-2 lots file (kibbutzim/<slug>/lots.js or lots.enc.js); ?lots=1 does the same -->
<meta name="kmap-lots" content="">
<style>
/* base reset */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>מפת הקיבוץ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: full-screen map canvas, floating control panel, bottom action bar.
   Palette: olive/sage land, warm sand paper, signal red for anything marked. */
:root{
  --bg:#eceae3;          /* sand paper */
  --panel:#ffffff;
  --ink:#23251f;
  --muted:#6b6f63;
  --line:#d4d2c7;
  --land:#e7e4d8;        /* lot fill (phase 2) */
  --land-line:#b4b1a2;
  --build:#d9d5c6;       /* building fill */
  --build-line:#a29e8d;
  --build-out:#e4e1d6;   /* buildings outside the village boundary */
  --anchor:#c7d3a0;      /* landmark fill */
  --anchor-line:#7e955a;
  --anchor-ink:#2a4020;
  --lawn:#d6e7bf;        /* parks, lawns, pitches */
  --pool:#9fd0ee;--pool-line:#3f8fc4;
  --orchard:#e1e8cf;--orchard-line:#c3d3a6;
  --farm:#ebe7d6;        /* farmland, farmyards */
  --wood:#d3e0c0;
  --cemetery:#dcdcd0;--cemetery-line:#b5b5a4;
  --road-line:#ffffff;
  --road-edge:#cfccbe;
  --path-line:#b4b1a2;
  --bound:#9a9686;
  --gate:#c0392b;--gate-ring:#fff;
  --road:#f6f4ee;        /* ground */
  --accent:#c0392b;--accent-soft:#e74c3c;
  --sel:#c0392b;--sel-fill:rgba(192,57,43,.28);
  --focus:#2d6cdf;
  --shadow:0 2px 10px rgba(35,37,31,.12),0 8px 28px rgba(35,37,31,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1c18;--panel:#24261f;--ink:#edeadf;--muted:#9a9e8e;--line:#3a3c32;
  --land:#33352b;--land-line:#565848;--build:#3d4034;--build-line:#5e6150;--build-out:#2e3028;--road:#1f201b;
  --anchor:#45512f;--anchor-line:#73894f;--anchor-ink:#c6e39e;
  --lawn:#2b3a22;--pool:#27506b;--pool-line:#5ea8d8;--orchard:#2f3a26;--orchard-line:#44532f;
  --farm:#26281f;--wood:#28351f;--cemetery:#2f302a;--cemetery-line:#4a4b40;
  --bound:#6a6757;--gate:#ff6150;--gate-ring:#24261f;
  --road-line:#2d2f27;--road-edge:#3f4136;--path-line:#4a4c40;
  --accent:#e74c3c;--accent-soft:#ff6150;--sel:#ff6150;--sel-fill:rgba(231,76,60,.30);
  --focus:#5b8bff;--shadow:0 2px 10px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1b1c18;--panel:#24261f;--ink:#edeadf;--muted:#9a9e8e;--line:#3a3c32;
  --land:#33352b;--land-line:#565848;--build:#3d4034;--build-line:#5e6150;--build-out:#2e3028;--road:#1f201b;
  --anchor:#45512f;--anchor-line:#73894f;--anchor-ink:#c6e39e;
  --lawn:#2b3a22;--pool:#27506b;--pool-line:#5ea8d8;--orchard:#2f3a26;--orchard-line:#44532f;
  --farm:#26281f;--wood:#28351f;--cemetery:#2f302a;--cemetery-line:#4a4b40;
  --bound:#6a6757;--gate:#ff6150;--gate-ring:#24261f;
  --road-line:#2d2f27;--road-edge:#3f4136;--path-line:#4a4c40;
  --accent:#e74c3c;--accent-soft:#ff6150;--sel:#ff6150;--sel-fill:rgba(231,76,60,.30);
  --focus:#5b8bff;--shadow:0 2px 10px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Assistant","Heebo","Segoe UI",system-ui,-apple-system,sans-serif;
  direction:rtl;-webkit-user-select:none;user-select:none;
  touch-action:none;-webkit-text-size-adjust:100%;
}
#app{position:relative;height:100%;width:100%}

/* ---- map ---- */
#mapwrap{position:absolute;inset:0}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;-webkit-touch-callout:none}
#attr{position:absolute;z-index:14;right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(90px + env(safe-area-inset-bottom,0px));font-size:10px;color:var(--muted);direction:ltr;
  background:color-mix(in srgb,var(--panel) 75%,transparent);padding:1px 6px;border-radius:6px;pointer-events:none}

/* ---- top panel ---- */
.panel{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow)}
#top{
  top:calc(12px + env(safe-area-inset-top,0px));
  right:max(12px,env(safe-area-inset-right,0px));
  left:max(12px,env(safe-area-inset-left,0px));
  padding:9px 10px;display:flex;flex-direction:column;gap:7px;max-width:560px;margin-inline:auto;
}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#top .row{position:relative}
.searchwrap{flex:1;min-width:120px;display:flex}
#top #search{padding:6px 10px;font-size:13px}

#search{
  flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:9px;padding:9px 11px;font:inherit;font-size:14px;outline:none;
}
#search:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
#results{
  position:absolute;top:100%;margin-top:6px;right:10px;left:10px;z-index:30;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);
  max-height:46vh;overflow:auto;padding:5px;
}
#results .item{padding:9px 11px;border-radius:8px;cursor:pointer;display:flex;gap:9px;align-items:baseline}
#results .item:hover,#results .item.active{background:color-mix(in srgb,var(--accent) 12%,transparent)}
#results .item .nm{font-weight:600;font-size:14px}
#results .item .nu{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#results .empty{padding:12px;color:var(--muted);font-size:13px;text-align:center}

.modes{display:flex;gap:6px;flex-wrap:wrap}
.mode{
  flex:1;min-width:72px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:9px;padding:8px 6px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.1;transition:.12s;
}
.mode svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.mode:hover{border-color:var(--muted)}
.mode.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);min-height:16px;line-height:1.35}

/* ---- bottom bar ---- */
#bottom{
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  right:max(12px,env(safe-area-inset-right,0px));
  left:max(12px,env(safe-area-inset-left,0px));
  padding:10px;display:flex;flex-direction:column;gap:9px;max-width:560px;margin-inline:auto;
}
#search,#caption,#results,#pw{touch-action:auto;-webkit-user-select:text;user-select:text}
#captionwrap{position:relative;width:100%}
#capclear{
  position:absolute;top:7px;inset-inline-start:7px;width:24px;height:24px;border:0;border-radius:6px;
  background:var(--line);color:var(--ink);font-size:15px;line-height:1;cursor:pointer;display:none;
  align-items:center;justify-content:center;padding:0;
}
#captionwrap.has-text #capclear{display:flex}
#caption,#pw{
  width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:9px;padding:9px 11px;font:inherit;font-size:14px;resize:none;outline:none;line-height:1.4;
}
#caption{padding-inline-start:38px}
#caption:focus,#pw:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.btn{
  border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;
  padding:10px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.12s;white-space:nowrap;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);flex:1}
.btn.primary:hover{background:var(--accent-soft)}

.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tg{border:0;background:var(--bg);color:var(--muted);font:inherit;font-size:12px;font-weight:600;
  padding:5px 10px;cursor:pointer}
.tg.on{background:var(--accent);color:#fff}
.tg+.tg{border-inline-start:1px solid var(--line)}

#zoom{position:absolute;z-index:15;left:max(12px,env(safe-area-inset-left,0px));
  bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#zoom button{
  width:40px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:10px;font-size:22px;font-weight:400;cursor:pointer;box-shadow:var(--shadow);line-height:1;
}

/* overlays: export (two steps), kibbutz picker, password */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;
  align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  touch-action:pan-y}
.overlay .sheet{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
  max-width:540px;width:100%;max-height:100%;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.step{display:flex;flex-direction:column;gap:12px}
.stephead{display:flex;align-items:center;gap:10px}
.stepnum{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:20px;
  padding:2px 9px;font-variant-numeric:tabular-nums}
.overlay h3{margin:0;font-size:17px}
.overlay p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.overlay .row .btn{flex:1}
.shot{margin:0;display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.shot img{width:100%;border-radius:8px;border:1px solid var(--line);display:block;background:var(--panel);
  -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;touch-action:auto}
.savemsg{color:var(--accent)!important;font-weight:700}
.stickyrow{position:sticky;bottom:-16px;background:var(--panel);padding:10px 0 2px;margin-bottom:-2px}
.fallback{font-size:12px!important}
.appver{font-size:11px!important;text-align:center;opacity:.7;direction:ltr}
.picklist{display:flex;flex-direction:column;gap:8px}
.picklist a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--ink);text-decoration:none;font-weight:700}
.focusable:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Mobile: exactly one screen tall; the map takes what's left between the panels. */
@media (max-width:640px){
  html,body{height:100%;overflow:hidden}
  #app{height:100%;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column}
  .panel{position:static;max-width:none;box-shadow:none;border-radius:12px}
  #top{order:1;inset:auto;margin:8px 8px 0;flex:none}
  #mapwrap{position:relative;inset:auto;order:2;flex:1 1 auto;min-height:0;
    margin:8px;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
  #bottom{order:3;inset:auto;margin:0 8px 8px;flex:none}
  #zoom{bottom:16px}
  #attr{bottom:4px;right:6px}
  .mode{font-size:12px;min-width:0;padding:7px 4px}
  .hint{min-height:calc(1.35em * 2)}
}
</style>
</head>
<body>

<div id="app">
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="attr"></div>
    <div id="zoom">
      <button id="zin" class="focusable" aria-label="התקרבות">+</button>
      <button id="zout" class="focusable" aria-label="התרחקות">−</button>
      <button id="zreset" class="focusable" aria-label="מרכוז" title="מרכוז">⌖</button>
    </div>
  </div>

  <div id="top" class="panel">
    <div class="modes">
      <button class="mode on focusable" data-mode="multi" title="סימון בתים">
        <svg viewBox="0 0 24 24"><path d="M3 20V9l5-4 5 4v11"/><path d="M13 20V12l4-3 4 3v8"/></svg>סימון בתים</button>
      <button class="mode focusable" data-mode="road" title="סימון כבישים">
        <svg viewBox="0 0 24 24"><path d="M4 20l6-16M20 20l-6-16"/><path d="M12 5v3M12 11v3M12 17v2" stroke-dasharray="2 2"/></svg>סימון כבישים</button>
      <button class="mode focusable" data-mode="draw" title="ציור חופשי בעיפרון אדום">
        <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>ציור חופשי</button>
    </div>
    <div class="row">
      <!-- names / numbers exist only with phase-2 lots -->
      <div class="toggle" id="labeltoggle" role="group" aria-label="תוויות על המפה" hidden>
        <button class="tg on focusable" data-label="none">נקי</button>
        <button class="tg focusable" data-label="name">שמות</button>
        <button class="tg focusable" data-label="num">מספרים</button>
      </div>
      <!-- with lots as the main view, building outlines are an optional layer -->
      <div class="toggle" id="buildtoggle" hidden><button class="tg focusable" id="btnBuild" aria-pressed="false">מבנים</button></div>
      <div class="searchwrap">
        <input id="search" class="focusable" type="text" placeholder="חיפוש מקום…" autocomplete="off" spellcheck="false">
      </div>
      <div id="results" hidden></div>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div id="bottom" class="panel">
    <div class="row">
      <button class="btn focusable" id="clear">נקה בחירה</button>
      <button class="btn primary focusable" id="export">יצירת הודעה</button>
    </div>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="sheet">
      <div id="stepCaption" class="step">
        <div class="stephead"><span class="stepnum">1/2</span><h3>כיתוב להודעה</h3></div>
        <p>הכיתוב יופיע בראש התמונה, גדול ובולט. אפשר להשאיר ריק.</p>
        <div id="captionwrap">
          <textarea id="caption" rows="3" placeholder="למשל: הפסקת מים מחר 8:00–12:00"></textarea>
          <button id="capclear" type="button" aria-label="ניקוי טקסט" title="ניקוי טקסט">✕</button>
        </div>
        <div class="row">
          <button class="btn focusable" id="backToMap">חזרה למפה</button>
          <button class="btn primary focusable" id="makeImages">יצירת תמונות</button>
        </div>
      </div>
      <div id="stepResult" class="step" hidden>
        <div class="stephead"><span class="stepnum">2/2</span><h3>התמונות מוכנות</h3></div>
        <figure class="shot">
          <img id="imgNear" alt="תמונה קרובה של האזור המסומן">
          <button class="btn focusable copyone" type="button" data-shot="near">העתק</button>
        </figure>
        <figure class="shot">
          <img id="imgFar" alt="מבט רחוק על הקיבוץ עם האזור המסומן">
          <button class="btn focusable copyone" type="button" data-shot="far">העתק</button>
        </figure>
        <p id="savemsg" class="savemsg" hidden></p>
        <p class="fallback">אפשר גם ללחוץ לחיצה ארוכה על תמונה (בטלפון) או קליק ימני (במחשב) כדי לשמור אותה.</p>
        <p class="appver" id="appver"></p>
        <div class="row stickyrow">
          <button class="btn focusable" id="backToCaption">עריכה</button>
          <button class="btn primary focusable" id="shareBoth">שיתוף</button>
          <button class="btn focusable" id="closeov">יציאה</button>
        </div>
      </div>
    </div>
  </div>

  <!-- no ?k= in the URL: choose a kibbutz -->
  <div id="picker" class="overlay" hidden>
    <div class="sheet step">
      <h3>בחירת קיבוץ</h3>
      <div class="picklist" id="picklist"></div>
    </div>
  </div>

  <!-- phase 2, option B: names are encrypted; ask for the kibbutz password -->
  <div id="pwbox" class="overlay" hidden>
    <form class="sheet step" id="pwform">
      <h3>סיסמת הקיבוץ</h3>
      <p>שמות הדיירים מוגנים בסיסמה. בלי סיסמה המפה תוצג בלי שמות.</p>
      <input id="pw" type="password" autocomplete="current-password">
      <p id="pwerr" class="savemsg" hidden>הסיסמה שגויה</p>
      <div class="row">
        <button class="btn focusable" type="button" id="pwskip">בלי שמות</button>
        <button class="btn primary focusable" type="submit">כניסה</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ---------- data loading ----------
   index.html is generic. ?k=<slug> picks kibbutzim/<slug>/map.js (built by
   tools/build_kibbutz.py from OSM + Overture). With ?lots=1 (or the kmap-lots
   meta) it also loads the phase-2 lots: lots.js (plain) or lots.enc.js
   (names encrypted with a per-kibbutz password). Neither lots file is ever in
   this repo; they live in each kibbutz's own deployment. */
(function(){
"use strict";
const qs=new URLSearchParams(location.search);
const meta=n=>(document.querySelector('meta[name="'+n+'"]')||{}).content||'';
const slug=(qs.get('k')||meta('kmap-default')||'').replace(/[^a-z0-9-]/gi,'');
const wantLots=qs.get('lots')==='1'||meta('kmap-lots')==='1';
function load(src){ return new Promise((ok,bad)=>{ const s=document.createElement('script');
  // Hourly cache-buster: a rebuilt map reaches phones within an hour.
  s.src=src+'?h='+Math.floor(Date.now()/36e5); s.onload=ok; s.onerror=()=>bad(new Error('missing '+src)); document.head.appendChild(s); }); }
if(!slug){
  load('kibbutzim/index.js').then(()=>{
    document.getElementById('picklist').innerHTML=(window.KLIST||[]).map(k=>
      '<a class="focusable" href="?k='+encodeURIComponent(k.slug)+'">'+k.name+'</a>').join('');
    document.getElementById('picker').hidden=false;
  }).catch(()=>{ document.body.innerHTML='<p style="padding:24px">אין עדיין מפות. יש להריץ את tools/build_kibbutz.py.</p>'; });
  return;
}
const base='kibbutzim/'+slug+'/';
// A single-file export (tools/export_html.py) already holds KMAP; wait for the
// rest of the page to parse so startMap exists.
(window.KMAP?new Promise(r=>addEventListener('DOMContentLoaded',r)):load(base+'map.js')).then(async()=>{
  if(wantLots){
    try{ await load(base+'lots.js'); }
    catch(_){ try{ await load(base+'lots.enc.js'); window.KLOTS=await unlockLots(window.KLOTS_ENC); }catch(e){ console.info('no lots', e.message); } }
  }
  window.startMap(window.KMAP, window.KLOTS||null);
}).catch(e=>{ document.body.innerHTML='<p style="padding:24px">לא נמצאה מפה לקיבוץ הזה.</p>'; console.error(e); });

/* Phase 2, option B. lots.enc.js defines KLOTS_ENC = {v:1, iter, salt, iv, ct}
   (base64). Key = PBKDF2-SHA256(password, salt, iter) -> AES-GCM-256.
   tools/load_lots.py --password writes it. The password is kept for this tab only. */
function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function decrypt(enc, pw){
  const k0=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256'},
    k0, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(enc.iv)}, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function unlockLots(enc){
  return new Promise(resolve=>{
    let saved=null; try{ saved=sessionStorage.getItem('kmap-pw-'+slug); }catch(_){}
    const box=document.getElementById('pwbox'), pw=document.getElementById('pw'), err=document.getElementById('pwerr');
    const tryPw=async p=>{ try{ const d=await decrypt(enc,p); try{ sessionStorage.setItem('kmap-pw-'+slug,p); }catch(_){}
      box.hidden=true; resolve(d); return true; }catch(_){ return false; } };
    (async()=>{
      if(saved && await tryPw(saved)) return;
      box.hidden=false; setTimeout(()=>pw.focus(),50);
      document.getElementById('pwform').onsubmit=async e=>{ e.preventDefault(); err.hidden=true;
        if(!await tryPw(pw.value)) err.hidden=false; };
      document.getElementById('pwskip').onclick=()=>{ box.hidden=true; resolve(null); };
    })();
  });
}
})();
</script>
<script>
window.startMap=function(KMAP, KLOTS){
"use strict";
const M=KMAP.meta;
const APP_VERSION=(document.querySelector('meta[name="app-version"]')||{}).content||'dev';
document.getElementById('appver').textContent='kibutz-map-events v'+APP_VERSION;
console.info('kibutz-map-events v'+APP_VERSION+' · '+M.slug+' · built '+M.built);
document.title='מפת '+M.name;
const ATTR='© OpenStreetMap contributors · Overture Maps'+(M.datasets&&M.datasets['Microsoft ML Buildings']?' · Microsoft':'');
document.getElementById('attr').textContent=ATTR;

/* The markable units. Phase 1: building outlines. Phase 2: the kibbutz's lots
   become the main view, and buildings an optional background layer. */
const HAS_LOTS=!!(KLOTS && KLOTS.units && KLOTS.units.length);
const BUILDINGS=KMAP.units;
const F=HAS_LOTS ? KLOTS.units : BUILDINGS;
let showBuildings=false;              // phase 2 only: draw buildings under the lots
const UNIT=HAS_LOTS?'בתים':'מבנים';
if(HAS_LOTS){
  document.getElementById('labeltoggle').hidden=false;
  document.getElementById('buildtoggle').hidden=false;
  document.getElementById('search').placeholder='חיפוש שם או מספר…';
}
const canvas=document.getElementById('map');
const ctx=canvas.getContext('2d');

/* ---------- context geography (from OSM + config.json) ---------- */
const KBOUND=KMAP.boundary;
const KGATE=KMAP.gate;
const KSPOTS=KMAP.spots||[];
const KAREAS=KMAP.areas||[];
const ROADS=KMAP.roads||[], PATHS=KMAP.paths||[];

/* ---------- geo bounds: the village boundary plus the units inside it ---------- */
let minLng=Infinity,maxLng=-Infinity,minLat=Infinity,maxLat=-Infinity;
const grow=([x,y])=>{ if(x<minLng)minLng=x; if(x>maxLng)maxLng=x; if(y<minLat)minLat=y; if(y>maxLat)maxLat=y; };
KBOUND.forEach(grow);
for(const f of F){ if(f.v===0) continue; for(const poly of f.geom) poly[0].forEach(grow); }
const midLat=(minLat+maxLat)/2;
const kx=Math.cos(midLat*Math.PI/180);
function wx(lng){ return lng*kx; }
function wy(lat){ return -lat; }
const W0=wx(minLng), W1=wx(maxLng), H0=wy(maxLat), H1=wy(minLat);
const worldW=W1-W0, worldH=H1-H0;

/* ---------- view ---------- */
let view={scale:1, ox:0, oy:0, _fit:null};
let DPR=Math.min(window.devicePixelRatio||1, 2.5);
let CW=0, CH=0;
function resize(){
  const r=canvas.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const oldW=CW, oldH=CH;
  CW=r.width; CH=r.height;
  canvas.width=Math.round(CW*DPR); canvas.height=Math.round(CH*DPR);
  if(!oldW || !view._fit) fitAll();
  else { view.ox+=(CW-oldW)/2; view.oy+=(CH-oldH)/2; draw(); }
}
function fitAll(){
  const pad=40;
  const s=Math.min((CW-pad*2)/worldW, (CH-pad*2)/worldH);
  view.scale=s;
  view.ox=(CW-worldW*s)/2 - W0*s;
  view.oy=(CH-worldH*s)/2 - H0*s;
  view._fit=s;
  draw();
}
function sx(lng){ return wx(lng)*view.scale+view.ox; }
function sy(lat){ return wy(lat)*view.scale+view.oy; }

/* ---------- selection state ---------- */
let mode='multi';
let labelMode='none';
const selected=new Set();
const roadStrokes=[], drawStrokes=[];
let curStroke=null, curDraw=null, snapLine=null;
let brushVisited=null, brushMode='add';
let pressTimer=null, longPress=false, appliedDown=false;

function shortLabel(s){
  s=s.trim();
  if(s.length<=14) return s;
  s=s.split('+')[0].split(' ו')[0].trim();
  return s.length>16 ? s.slice(0,15)+'…' : s;
}

/* ---------- drawing ---------- */
function polyTo(c,geom,X,Y){
  for(const poly of geom) for(const ring of poly){
    for(let i=0;i<ring.length;i++){ const px=X(ring[i][0]),py=Y(ring[i][1]); i?c.lineTo(px,py):c.moveTo(px,py); }
    c.closePath();
  }
}
function featurePath(f){ const p=new Path2D(); polyTo(p,f.geom,sx,sy); return p; }
function cssvar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function colors(){
  const n=['road','land','land-line','build','build-line','build-out','ink','muted','sel','sel-fill','panel','accent','line','bg',
    'anchor','anchor-line','anchor-ink','lawn','pool','pool-line','orchard','orchard-line','farm','wood','cemetery','cemetery-line',
    'bound','gate','gate-ring','road-line','road-edge','path-line'];
  const C={}; for(const k of n) C[k.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())]=cssvar('--'+k); return C;
}

/* areas, roads, paths, boundary, gate, spots: shared by the screen and the exports.
   g = {c: ctx, X: lng->px, Y: lat->px, spots: false|'dot'|true} */
function drawContext(g, C, s){
  const c=g.c;
  const fillOf={farm:C.farm, wood:C.wood, orchard:C.orchard, green:C.lawn, cemetery:C.cemetery, water:C.pool};
  for(const a of KAREAS){
    c.beginPath(); polyTo(c,a.g,g.X,g.Y);
    c.fillStyle=fillOf[a.k]||C.farm; c.fill('evenodd');
    if(a.k==='orchard' || a.k==='cemetery'){
      // diagonal rows read as "planted"; crosses would be too busy, so cemeteries get the same hatch
      c.save(); c.clip('evenodd');
      c.strokeStyle=a.k==='orchard'?C.orchardLine:C.cemeteryLine; c.lineWidth=1;
      let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
      for(const [lng,lat] of a.g[0][0]){ const X=g.X(lng),Y=g.Y(lat); x0=Math.min(x0,X);x1=Math.max(x1,X);y0=Math.min(y0,Y);y1=Math.max(y1,Y); }
      const h=y1-y0, step=9*s;
      for(let x=x0-h; x<x1; x+=step){ c.beginPath(); c.moveTo(x,y0); c.lineTo(x+h,y1); c.stroke(); }
      c.restore();
    }
    if(a.k==='water'){ c.lineWidth=1.5*s; c.strokeStyle=C.poolLine; c.lineJoin='round'; c.stroke(); }
  }
  c.lineCap='round'; c.lineJoin='round'; c.setLineDash([]);
  function stroke(line,w,col){
    c.beginPath();
    for(let i=0;i<line.length;i++){ const X=g.X(line[i][0]),Y=g.Y(line[i][1]); i?c.lineTo(X,Y):c.moveTo(X,Y); }
    c.lineWidth=w; c.strokeStyle=col; c.stroke();
  }
  const rw=Math.max(2.5, 3.4*s);
  for(const line of ROADS) stroke(line, rw+2*s, C.roadEdge);
  for(const line of ROADS) stroke(line, rw, C.roadLine);
  c.setLineDash([5*s,4*s]);
  for(const line of PATHS) stroke(line, Math.max(1,1.4*s), C.pathLine);
  c.setLineDash([]);
  // boundary ring
  c.beginPath();
  for(let i=0;i<KBOUND.length;i++){ const X=g.X(KBOUND[i][0]),Y=g.Y(KBOUND[i][1]); i?c.lineTo(X,Y):c.moveTo(X,Y); }
  c.closePath(); c.strokeStyle=C.bound; c.lineWidth=2.4*s; c.stroke();
  // gate (its label box is reserved so spot names don't print over it)
  const taken=[];
  const free=b=>!taken.some(p=>!(b.x1<p.x0||b.x0>p.x1||b.y1<p.y0||b.y0>p.y1));
  if(KGATE){
    const gx=g.X(KGATE[0]), gy=g.Y(KGATE[1]);
    c.fillStyle=C.gate; c.beginPath(); c.arc(gx,gy,5.5*s,0,7); c.fill();
    c.lineWidth=2*s; c.strokeStyle=C.gateRing; c.stroke();
    c.font='700 '+(12*s)+'px "Assistant",sans-serif'; c.textAlign='right'; c.textBaseline='middle';
    c.lineWidth=3*s; c.strokeStyle=C.panel; c.strokeText('שער הכניסה', gx-9*s, gy);
    c.fillStyle=C.gate; c.fillText('שער הכניסה', gx-9*s, gy);
    const gw=c.measureText('שער הכניסה').width;
    taken.push({x0:gx-9*s-gw-2, y0:gy-7*s, x1:gx+6*s, y1:gy+7*s});
  }
  // named spots: a green dot or little house (icon 'none' = an area name, no marker)
  if(g.spots) for(const sp of KSPOTS){
    const px=g.X(sp.c[0]), py=g.Y(sp.c[1]);
    if(sp.icon!=='none'){
      c.fillStyle=C.anchorLine; c.beginPath();
      if(sp.icon==='house'){ const u=7*s;
        c.moveTo(px-u*0.8,py+u); c.lineTo(px-u*0.8,py); c.lineTo(px,py-u); c.lineTo(px+u*0.8,py); c.lineTo(px+u*0.8,py+u); c.closePath();
      } else c.arc(px,py,4.5*s,0,7);
      c.fill(); c.lineWidth=2*s; c.strokeStyle=C.gateRing; c.stroke();
    }
    if(g.spots==='dot') continue;
    c.textAlign=sp.icon==='none'?'center':'right'; c.textBaseline='middle';
    c.font='700 '+(12*s)+'px "Assistant",sans-serif';
    const gap=sp.icon==='none'?0:(sp.icon==='house'?10:8)*s;
    const tw=c.measureText(sp.name).width, X0=sp.icon==='none'?px-tw/2:px-gap-tw;
    const box={x0:X0-2, y0:py-7*s, x1:X0+tw+2, y1:py+7*s};
    if(!free(box)) continue;
    taken.push(box);
    c.lineWidth=3*s; c.strokeStyle=C.panel; c.strokeText(sp.name, px-gap, py);
    c.fillStyle=C.anchorInk; c.fillText(sp.name, px-gap, py);
  }
}
function unitFill(f,C){ return f.anchor?C.anchor : HAS_LOTS ? (f.kind==='מבנה'?C.build:C.land) : (f.v===0?C.buildOut:C.build); }
function unitLine(f,C){ return f.anchor?C.anchorLine : HAS_LOTS ? C.landLine : C.buildLine; }

function draw(){
  const C=colors();
  ctx.save(); ctx.scale(DPR,DPR);
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle=C.road; ctx.fillRect(0,0,CW,CH);
  const z=view.scale, base=view._fit||z;
  const zoomedIn = z > base*1.15;
  drawContext({c:ctx, X:sx, Y:sy, spots:zoomedIn?'dot':false}, C, 1);

  for(const f of F){
    const p=featurePath(f); f._p=p;
    ctx.fillStyle=unitFill(f,C); ctx.fill(p);
    ctx.lineWidth=f.anchor?1.4:1; ctx.strokeStyle=unitLine(f,C); ctx.stroke(p);
  }
  if(HAS_LOTS && showBuildings){        // optional layer: outlines only, over the lots
    ctx.lineWidth=1; ctx.strokeStyle=C.buildLine; ctx.setLineDash([3,2]);
    for(const b of BUILDINGS) ctx.stroke(featurePath(b));
    ctx.setLineDash([]);
  }
  for(const f of F){
    if(!selected.has(f.id)) continue;
    ctx.fillStyle=C.selFill; ctx.fill(f._p);
    ctx.lineWidth=2.4; ctx.strokeStyle=C.sel; ctx.stroke(f._p);
  }
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const st of curStroke?roadStrokes.concat([curStroke]):roadStrokes){
    if(!st || st.length<2) continue;
    ctx.beginPath(); for(let i=0;i<st.length;i++){ const X=sx(st[i][0]),Y=sy(st[i][1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
    ctx.lineWidth=6; ctx.strokeStyle=C.sel; ctx.stroke();
  }
  for(const st of curDraw?drawStrokes.concat([curDraw]):drawStrokes){
    if(!st || st.length<2) continue;
    ctx.beginPath(); for(let i=0;i<st.length;i++){ const X=sx(st[i][0]),Y=sy(st[i][1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
    ctx.lineWidth=3; ctx.strokeStyle=C.sel; ctx.stroke();
  }
  // labels: landmarks never overlap (marked first, then label_priority); a clash
  // tries one line up, then down, else waits until zoomed in
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const fs=Math.max(10,Math.min(13.5, z*0.00030));
  ctx.font='800 '+(fs+1.5)+'px "Assistant",sans-serif';
  const placedA=[], lh=(fs+1.5)*0.8;
  const hits=b=>placedA.some(p=>!(b.x1<=p.x0+1||b.x0>=p.x1-1||b.y1<=p.y0+1||b.y0>=p.y1-1));
  for(const f of anchorsByPriority()){
    if(!zoomedIn && ZOOMED_IN_ONLY.has(f.anchor) && !selected.has(f.id)) continue;
    const X=sx(f.c[0]), Y0=sy(f.c[1]);
    if(X<-40||X>CW+40||Y0<-20||Y0>CH+20) continue;
    const w=ctx.measureText(f.anchor).width;
    let b=null, Y=Y0;
    for(const dy of [0,-lh,lh]){
      const c={x0:X-w/2-1, y0:Y0+dy-lh/2, x1:X+w/2+1, y1:Y0+dy+lh/2};
      if(!hits(c)){ b=c; Y=Y0+dy; break; }
    }
    if(!b) continue;
    placedA.push(b);
    ctx.lineWidth=4.2; ctx.strokeStyle=C.panel; ctx.strokeText(f.anchor,X,Y);
    ctx.fillStyle=selected.has(f.id)?C.sel:C.anchorInk; ctx.fillText(f.anchor,X,Y);
  }
  if(zoomedIn){                       // spot names: lowest priority, only where they fit
    ctx.font='700 12px "Assistant",sans-serif';
    for(const sp of KSPOTS){
      const none=sp.icon==='none';
      const X=sx(sp.c[0])-(none?0:(sp.icon==='house'?10:8)), Y=sy(sp.c[1]), w=ctx.measureText(sp.name).width, h=12*0.8;
      const b=none?{x0:X-w/2-1,y0:Y-h/2,x1:X+w/2+1,y1:Y+h/2}:{x0:X-w-1, y0:Y-h/2, x1:X+12, y1:Y+h/2};
      if(hits(b)) continue;
      placedA.push(b);
      ctx.textAlign=none?'center':'right';
      ctx.lineWidth=3; ctx.strokeStyle=C.panel; ctx.strokeText(sp.name,X,Y);
      ctx.fillStyle=C.anchorInk; ctx.fillText(sp.name,X,Y);
    }
    ctx.textAlign='center';
  }
  const clean=labelMode==='none';
  for(const f of F){
    if(f.anchor) continue;
    const isSel=selected.has(f.id);
    if(clean && !isSel) continue;
    if(!zoomedIn && !isSel) continue;
    const X=sx(f.c[0]), Y=sy(f.c[1]);
    if(X<-40||X>CW+40||Y<-20||Y>CH+20) continue;
    let label=labelMode==='num' ? (f.num||'') : (f.name||(f.num?('#'+f.num):''));
    if(!label) continue;
    label=shortLabel(label);
    ctx.font=(isSel?'700 ':'600 ')+fs+'px "Assistant",sans-serif';
    ctx.lineWidth=3; ctx.strokeStyle=C.panel; ctx.strokeText(label,X,Y);
    ctx.fillStyle=isSel?C.sel:C.ink; ctx.fillText(label,X,Y);
  }
  ctx.restore();
}
const ANCHOR_RANK=M.label_priority||[];
const ZOOMED_IN_ONLY=new Set(M.zoomed_in_only||[]);
let _ranked=null;
function anchorsByPriority(){
  if(!_ranked){
    const r=f=>{ const i=ANCHOR_RANK.indexOf(f.anchor); return i<0?99:i; };
    _ranked=F.filter(f=>f.anchor).sort((a,b)=>r(a)-r(b));
  }
  return _ranked.filter(f=>selected.has(f.id)).concat(_ranked.filter(f=>!selected.has(f.id)));
}

/* ---------- hit testing: in geo space, point-in-polygon on the raw rings ---------- */
function pointInRing(lng,lat,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>lat)!==(yj>lat)) && (lng<(xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function hitFeature(px,py){
  const [lng,lat]=screenToGeo(px,py);
  for(let i=F.length-1;i>=0;i--){
    const f=F[i];
    for(const poly of f.geom){
      if(pointInRing(lng,lat,poly[0])){
        let inHole=false;
        for(let h=1;h<poly.length;h++){ if(pointInRing(lng,lat,poly[h])){inHole=true;break;} }
        if(!inHole) return f;
      }
    }
  }
  return null;
}

/* ---------- interaction (same model as the Yiftah app) ----------
   multi : tap toggles a unit; drag = brush that adds; long-press then drag removes.
   road  : drag draws a mark that snaps onto roads and dotted paths.
   draw  : drag draws a thin red pencil line.
   Road/draw: tap or long-press removes a mark; long-press then drag removes many.
   Two fingers always pan/zoom; a second finger within 400 ms undoes the first's mark. */
function toLocal(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
const LONG_MS=350;
let drag=null, painting=false, moved=false, downPt=null, downAt=0, btnPan=false, tol=4, pinch=null;
let selSnap=null, roadSnap=null, drawSnap=null;
const pts=new Map();
function buzz(){ if(navigator.vibrate) try{navigator.vibrate(25)}catch(_){} }
function cancelGesture(){
  clearTimeout(pressTimer);
  if(painting && Date.now()-downAt<400){
    if(selSnap){ selected.clear(); selSnap.forEach(id=>selected.add(id)); }
    if(roadSnap){ roadStrokes.length=0; roadStrokes.push(...roadSnap); }
    if(drawSnap){ drawStrokes.length=0; drawStrokes.push(...drawSnap); }
  }
  painting=false; curStroke=null; curDraw=null; snapLine=null; brushVisited=null; drag=null; longPress=false;
  selSnap=null; roadSnap=null; drawSnap=null;
  draw();
}
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  const l=toLocal(e);
  pts.set(e.pointerId,l);
  if(pts.size>=2){ cancelGesture(); pinch=null; handlePinch(); return; }
  downPt=l; downAt=Date.now(); moved=false; longPress=false; brushMode='add';
  tol=e.pointerType==='touch'?10:4;
  if(e.button===2 || e.button===1){ drag={x:l.x,y:l.y,ox:view.ox,oy:view.oy}; btnPan=true; return; }
  btnPan=false;
  if(mode==='multi'){
    painting=true; brushVisited=new Set(); appliedDown=false; selSnap=new Set(selected);
    pressTimer=setTimeout(()=>{
      if(painting && !moved){ longPress=true; brushMode='remove'; buzz(); applyPaint(downPt.x,downPt.y); appliedDown=true; }
    }, LONG_MS);
  } else {
    painting=true;
    if(mode==='road'){ roadSnap=roadStrokes.slice(); snapLine=null; curStroke=[]; const s=snapToRoad(l.x,l.y); if(s) curStroke.push(s); }
    else { drawSnap=drawStrokes.slice(); curDraw=[screenToGeo(l.x,l.y)]; }
    pressTimer=setTimeout(()=>{
      if(painting && !moved){ longPress=true; curStroke=null; curDraw=null; buzz(); removeNearestStroke(curMarks(),downPt.x,downPt.y); }
    }, LONG_MS);
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  const l=toLocal(e); pts.set(e.pointerId,l);
  if(pts.size>=2){ handlePinch(); return; }
  if(painting){
    const dx=l.x-downPt.x, dy=l.y-downPt.y;
    if(!moved && Math.abs(dx)+Math.abs(dy)>tol){ moved=true; if(!longPress) clearTimeout(pressTimer); }
    if(longPress && (mode==='road'||mode==='draw')){ if(moved) removeNearestStroke(curMarks(),l.x,l.y); }
    else if(mode==='draw'){
      if(curDraw){ const last=curDraw[curDraw.length-1];
        if(Math.hypot(l.x-sx(last[0]), l.y-sy(last[1]))>2){ curDraw.push(screenToGeo(l.x,l.y)); draw(); } }
    } else if(mode==='road'){
      if(curStroke){ const s=snapToRoad(l.x,l.y);
        if(s){ const last=curStroke[curStroke.length-1];
          if(!last || Math.hypot(sx(s[0])-sx(last[0]), sy(s[1])-sy(last[1]))>3){ curStroke.push(s); draw(); } } }
    } else if(moved){
      if(!appliedDown){ applyPaint(downPt.x,downPt.y); appliedDown=true; }
      applyPaint(l.x,l.y);
    }
    return;
  }
  if(!drag) return;
  const dx=l.x-drag.x, dy=l.y-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>tol) moved=true;
  view.ox=drag.ox+dx; view.oy=drag.oy+dy; draw();
});
function endPointer(e){
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=null;
  clearTimeout(pressTimer);
  if(painting){
    if(mode==='road' || mode==='draw'){
      const cur=mode==='road'?curStroke:curDraw;
      if(longPress){}
      else if(moved && cur && cur.length>=2) curMarks().push(cur);
      else if(!moved) handleTap(downPt.x,downPt.y);
      curStroke=null; curDraw=null; snapLine=null;
    } else if(!moved && !longPress) handleTap(downPt.x,downPt.y);
    painting=false; brushVisited=null; selSnap=null; roadSnap=null; drawSnap=null;
    draw(); return;
  }
  drag=null; btnPan=false;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
function applyPaint(x,y){
  const f=hitFeature(x,y); if(!f) return;
  if(brushVisited.has(f.id)) return; brushVisited.add(f.id);
  if(brushMode==='remove') selected.delete(f.id); else selected.add(f.id);
  draw();
}
function handleTap(x,y){
  if(mode==='road' || mode==='draw'){ removeNearestStroke(curMarks(),x,y); return; }
  const f=hitFeature(x,y); if(!f) return;
  if(selected.has(f.id)) selected.delete(f.id); else selected.add(f.id);
  draw();
}
function screenToGeo(x,y){ return [((x-view.ox)/view.scale)/kx, -((y-view.oy)/view.scale)]; }
function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0; t=Math.max(0,Math.min(1,t));
  const cx=ax+t*dx, cy=ay+t*dy; return {d:Math.hypot(px-cx,py-cy), cx, cy};
}
const SNAP_LINES=ROADS.concat(PATHS);
function snapToRoad(x,y){
  let best=null, bestD=22, bestLine=null, stay=null, stayD=Infinity;
  for(const line of SNAP_LINES){
    for(let i=0;i<line.length-1;i++){
      const r=closestOnSeg(x,y,sx(line[i][0]),sy(line[i][1]),sx(line[i+1][0]),sy(line[i+1][1]));
      if(r.d<bestD){ bestD=r.d; best=r; bestLine=line; }
      if(line===snapLine && r.d<stayD){ stayD=r.d; stay=r; }
    }
  }
  if(stay && stayD<22 && stayD-bestD<8){ best=stay; bestLine=snapLine; }
  if(!best) return null;
  snapLine=bestLine;
  return screenToGeo(best.cx,best.cy);
}
function curMarks(){ return mode==='draw'?drawStrokes:roadStrokes; }
function removeNearestStroke(list,x,y){
  let bi=-1, bestD=24;
  for(let k=0;k<list.length;k++){ const st=list[k];
    for(let i=0;i<st.length-1;i++){
      const r=closestOnSeg(x,y,sx(st[i][0]),sy(st[i][1]),sx(st[i+1][0]),sy(st[i+1][1]));
      if(r.d<bestD){ bestD=r.d; bi=k; }
    } }
  if(bi>=0){ list.splice(bi,1); draw(); }
}
canvas.addEventListener('wheel',e=>{ e.preventDefault(); const l=toLocal(e); zoomAt(l.x,l.y,e.deltaY<0?1.15:1/1.15); },{passive:false});
function zoomAt(cx,cy,f){
  const wX=(cx-view.ox)/view.scale, wY=(cy-view.oy)/view.scale;
  view.scale*=f; view.ox=cx-wX*view.scale; view.oy=cy-wY*view.scale; draw();
}
function handlePinch(){
  const [a,b]=[...pts.values()];
  const d=Math.hypot(a.x-b.x,a.y-b.y), mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  if(pinch && pinch.d>0){ zoomAt(pinch.mid.x,pinch.mid.y,d/pinch.d); view.ox+=mid.x-pinch.mid.x; view.oy+=mid.y-pinch.mid.y; draw(); }
  pinch={d,mid};
}
document.getElementById('zin').onclick=()=>zoomAt(CW/2,CH/2,1.3);
document.getElementById('zout').onclick=()=>zoomAt(CW/2,CH/2,1/1.3);

/* ---------- modes, labels, layers ---------- */

  multi:'לחיצה או גרירה מסמנת '+UNIT+'. לחיצה ארוכה ואז גרירה מבטלת סימון. שתי אצבעות מזיזות את המפה.',
  road:'גרירה לאורך כביש או שביל מציירת קטע. לחיצה או לחיצה ארוכה על סימון מוחקת אותו. שתי אצבעות מזיזות את המפה.',
  draw:'גרירה מציירת קו חופשי. לחיצה או לחיצה ארוכה על קו מוחקת אותו. שתי אצבעות מזיזות את המפה.'
};

const capEl=document.getElementById('caption'), capWrap=document.getElementById('captionwrap');

/* ---------- search: landmarks and spots (phase 1); also names and numbers (phase 2) ---------- */
const search=document.getElementById('search'), results=document.getElementById('results');
function norm(s){ return (s||'').replace(/["'`.]/g,'').trim().toLowerCase(); }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
search.addEventListener('input',()=>{
  const q=norm(search.value);
  if(!q){ results.hidden=true; results.innerHTML=''; return; }
  const hitsF=[];
  for(const f of F){
    if(norm(f.anchor||f.name).includes(q) || norm(f.num).includes(q)) hitsF.push(f);
    if(hitsF.length>=40) break;
  }
  const hitsS=KSPOTS.map((s,i)=>[s,i]).filter(([s])=>norm(s.name).includes(q)).slice(0,10);
  if(!hitsF.length && !hitsS.length){ results.hidden=false; results.innerHTML='<div class="empty">לא נמצאו תוצאות</div>'; return; }
  results.innerHTML=hitsF.map(f=>'<div class="item" data-id="'+f.id+'"><span class="nm">'+esc(f.anchor||f.name||'(ללא שם)')+'</span><span class="nu">'+esc(f.num||'')+'</span></div>').join('')
    + hitsS.map(([s,i])=>'<div class="item" data-spot="'+i+'"><span class="nm">'+esc(s.name)+'</span></div>').join('');
  results.hidden=false;
});
results.addEventListener('click',e=>{
  const it=e.target.closest('.item'); if(!it) return;
  if(it.dataset.spot!==undefined){ const s=KSPOTS[+it.dataset.spot]; zoomTo(s.c[0],s.c[0],s.c[1],s.c[1]); }
  else { const f=F.find(x=>String(x.id)===it.dataset.id); if(!f) return; selected.add(f.id); centerOn(f); }
  results.hidden=true; search.value='';
});
function centerOn(f){
  let a=Infinity,b=-Infinity,c=Infinity,d=-Infinity;
  for(const poly of f.geom) for(const [x,y] of poly[0]){ if(x<a)a=x;if(x>b)b=x;if(y<c)c=y;if(y>d)d=y; }
  zoomTo(a,b,c,d);
}
function zoomTo(a,b,c,d){
  const pad=120, ww=(wx(b)-wx(a))||1e-5, hh=(wy(c)-wy(d))||1e-5;
  const s=Math.min((CW-pad*2)/ww,(CH-pad*2)/hh, view._fit*9);
  view.scale=s; view.ox=CW/2-(wx(a)+wx(b))/2*s; view.oy=CH/2-(wy(c)+wy(d))/2*s; draw();
}
document.addEventListener('click',e=>{ if(!e.target.closest('#search')&&!e.target.closest('#results')) results.hidden=true; });
document.getElementById('clear').onclick=()=>{ selected.clear(); roadStrokes.length=0; drawStrokes.length=0; draw(); };

/* ---------- export: snapshot view -> caption -> two images ---------- */
const overlay=document.getElementById('overlay');
const stepCaption=document.getElementById('stepCaption'), stepResult=document.getElementById('stepResult');
let nearBounds=null, shots={near:null, far:null, long:null};
function viewBounds(){ const tl=screenToGeo(0,0), br=screenToGeo(CW,CH); return {w:tl[0], e:br[0], n:tl[1], s:br[1]}; }
function showStep(which){ stepCaption.hidden=which!=='caption'; stepResult.hidden=which!=='result';
  overlay.hidden=false; overlay.querySelector('.sheet').scrollTop=0; }
document.getElementById('export').onclick=()=>{ nearBounds=viewBounds(); showStep('caption'); setTimeout(()=>{ try{capEl.focus();}catch(_){} },50); };
document.getElementById('backToMap').onclick=()=>{ overlay.hidden=true; };
document.getElementById('backToCaption').onclick=()=>showStep('caption');
function resetAll(){
  overlay.hidden=true;
  selected.clear(); roadStrokes.length=0; drawStrokes.length=0; curStroke=null; curDraw=null;
  capEl.value=''; syncCap(); shots={near:null, far:null, long:null}; nearBounds=null;
  document.getElementById('imgNear').removeAttribute('src'); document.getElementById('imgFar').removeAttribute('src');
  document.getElementById('savemsg').hidden=true;
  search.value=''; results.hidden=true; results.innerHTML='';
  document.querySelector('.mode[data-mode="multi"]').click();
  document.querySelector('#labeltoggle .tg[data-label="none"]').click();
  fitAll();
}
document.getElementById('closeov').onclick=resetAll;
overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.hidden=true; });
document.getElementById('makeImages').onclick=()=>{
  const caption=capEl.value.trim(), m=0.0006;
  const farBounds={w:minLng-m, e:maxLng+m, n:maxLat+m, s:minLat-m};
  shots.near=renderMap(nearBounds,{caption, kind:'near'});
  shots.far=renderMap(farBounds,{caption, kind:'far', frame:nearBounds});
  shots.long=longImage(caption, renderMap(nearBounds,{caption:'',kind:'near'}), renderMap(farBounds,{caption:'',kind:'far',frame:nearBounds}));
  document.getElementById('imgNear').src=shots.near.toDataURL('image/png');
  document.getElementById('imgFar').src=shots.far.toDataURL('image/png');
  document.getElementById('savemsg').hidden=true;
  showStep('result');
};
function toBlob(cv){ return new Promise(res=>cv.toBlob(res,'image/png')); }
function say(t){ const m=document.getElementById('savemsg'); m.textContent=t; m.hidden=false; }
function longImage(caption, near, far){
  const W=Math.max(near.width,far.width), gap=24;
  const c=document.createElement('canvas'), x=c.getContext('2d');
  const capH=captionBand(x,W,caption,true);
  c.width=W; c.height=capH+near.height+gap+far.height;
  x.fillStyle=colors().panel; x.fillRect(0,0,c.width,c.height);
  captionBand(x,W,caption);
  x.drawImage(near,0,capH); x.drawImage(far,0,capH+near.height+gap);
  return c;
}
let embedded=true; try{ embedded=window.top!==window.self; }catch(_){}
let canShareFiles=false;
try{ canShareFiles=!embedded && !!(navigator.canShare && navigator.canShare({files:[new File([new Blob(['x'],{type:'image/png'})],'t.png',{type:'image/png'})]})); }catch(_){}
const shareBtn=document.getElementById('shareBoth');
shareBtn.textContent=canShareFiles?'שיתוף':'העתקה';
const NO_COPY='ההעתקה לא זמינה כאן. לחיצה ארוכה על התמונה תאפשר לשמור או לשתף אותה.';
function copyCanvas(cv,okMsg){
  try{ const item=new ClipboardItem({'image/png':toBlob(cv)});
    navigator.clipboard.write([item]).then(()=>say(okMsg),()=>say(NO_COPY)); }catch(_){ say(NO_COPY); }
}
document.querySelectorAll('.copyone').forEach(b=>{
  b.onclick=()=>{ const cv=shots[b.dataset.shot]; if(!cv) return;
    copyCanvas(cv, b.dataset.shot==='near'?'התמונה הקרובה הועתקה.':'התמונה הרחוקה הועתקה.'); };
});
shareBtn.onclick=async()=>{
  if(!shots.long) return;
  if(!canShareFiles){ copyCanvas(shots.long,'התמונה המשולבת הועתקה.'); return; }
  try{ await navigator.share({files:[new File([await toBlob(shots.long)], M.slug+'-map.png', {type:'image/png'})]}); }
  catch(err){ if(!(err && err.name==='AbortError')) copyCanvas(shots.long,'התמונה המשולבת הועתקה.'); }
};

/* One image. kind 'near' = the user's view; 'far' = the whole kibbutz with the
   marks circled and the near view framed. A footer carries the map credits. */
function renderMap(B, opts){
  const W=1200, brandH=76, footH=34;
  let b={...B};
  let gw=wx(b.e)-wx(b.w), gh=wy(b.s)-wy(b.n);
  if(gh/gw<0.55){ const add=(gw*0.55-gh)/2; b.n+=add; b.s-=add; }
  else if(gh/gw>1.5){ const add=(gh/1.5-gw)/2/kx; b.w-=add; b.e+=add; }
  gw=wx(b.e)-wx(b.w); gh=wy(b.s)-wy(b.n);
  const mapW=W, mapH=Math.round(W*gh/gw);
  const oc=document.createElement('canvas'), o=oc.getContext('2d');
  const capH=captionBand(o,W,opts.caption,true);
  const headerH=brandH+capH, H=headerH+mapH+footH;
  oc.width=W; oc.height=H;
  const C=colors();
  o.fillStyle=C.panel; o.fillRect(0,0,W,H);
  o.direction='rtl';
  captionBand(o,W,opts.caption);
  o.fillStyle=C.ink; o.textAlign='right'; o.textBaseline='middle';
  o.font='800 34px "Assistant",sans-serif';
  o.fillText('קיבוץ '+M.name, W-32, capH+brandH/2);
  o.textAlign='left'; o.font='700 24px "Assistant",sans-serif'; o.fillStyle=C.muted;
  let sub;
  if(opts.kind==='far') sub='מבט על הקיבוץ';
  else {
    const names=F.filter(f=>selected.has(f.id)).map(f=>f.anchor||f.name||(f.num?'בית '+f.num:'')).filter(Boolean);
    if(names.length && names.length===selected.size && selected.size<=3 && !roadStrokes.length && !drawStrokes.length) sub=names.join(' · ');
    else { const p=[]; if(selected.size)p.push(selected.size+' '+UNIT); if(roadStrokes.length)p.push(roadStrokes.length+' קטעי כביש'); sub=p.join(' · '); }
  }
  while(sub && o.measureText(sub).width>W-360) sub=sub.slice(0,-2);
  o.fillText(sub||'',32,capH+brandH/2);

  const ps=mapW/gw;
  const pxX=lng=>(wx(lng)-wx(b.w))*ps, pxY=lat=>headerH+(wy(lat)-wy(b.n))*ps;
  const far=opts.kind==='far';
  o.save(); o.beginPath(); o.rect(0,headerH,mapW,mapH); o.clip();
  o.fillStyle=C.road; o.fillRect(0,headerH,mapW,mapH);
  drawContext({c:o, X:pxX, Y:pxY, spots:!far}, C, far?1.8:2.2);
  const polyPath=f=>{ o.beginPath(); polyTo(o,f.geom,pxX,pxY); };
  for(const f of F){ polyPath(f); o.fillStyle=unitFill(f,C); o.fill();
    o.lineWidth=f.anchor?1.5:1; o.strokeStyle=unitLine(f,C); o.stroke(); }
  if(HAS_LOTS && showBuildings){ o.setLineDash([4,3]); o.lineWidth=1.2; o.strokeStyle=C.buildLine;
    for(const bd of BUILDINGS){ polyPath(bd); o.stroke(); } o.setLineDash([]); }
  for(const f of F){ if(!selected.has(f.id)) continue;
    polyPath(f); o.fillStyle=C.selFill; o.fill(); o.lineWidth=far?4:5.5; o.strokeStyle=C.sel; o.stroke(); }
  o.lineCap='round'; o.lineJoin='round';
  for(const [list,wn,wf] of [[roadStrokes,13,9],[drawStrokes,6,4]]) for(const st of list){ if(!st||st.length<2) continue;
    o.beginPath(); for(let i=0;i<st.length;i++){ const X=pxX(st[i][0]),Y=pxY(st[i][1]); i?o.lineTo(X,Y):o.moveTo(X,Y); }
    o.lineWidth=far?wf:wn; o.strokeStyle=C.sel; o.stroke(); }
  if(far){
    if(opts.frame){
      const fx0=pxX(opts.frame.w), fx1=pxX(opts.frame.e), fy0=pxY(opts.frame.n), fy1=pxY(opts.frame.s);
      if((fx1-fx0)*(fy1-fy0)<mapW*mapH*0.45 && fx0>-4 && fx1<mapW+4 && fy0>headerH-4 && fy1<headerH+mapH+4){
        o.setLineDash([16,10]); o.lineWidth=4; o.strokeStyle=C.ink; o.strokeRect(fx0,fy0,fx1-fx0,fy1-fy0); o.setLineDash([]);
      }
    }
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity,any=false;
    const g2=(lng,lat)=>{ const X=pxX(lng),Y=pxY(lat); x0=Math.min(x0,X);x1=Math.max(x1,X);y0=Math.min(y0,Y);y1=Math.max(y1,Y); any=true; };
    for(const f of F) if(selected.has(f.id)) for(const poly of f.geom) for(const [lng,lat] of poly[0]) g2(lng,lat);
    for(const st of roadStrokes.concat(drawStrokes)) for(const [lng,lat] of st) g2(lng,lat);
    if(any){ const cx=(x0+x1)/2, cy=(y0+y1)/2, r=Math.max(48,Math.hypot(x1-x0,y1-y0)/2+28);
      o.beginPath(); o.arc(cx,cy,r,0,Math.PI*2); o.fillStyle='rgba(192,57,43,.10)'; o.fill();
      o.lineWidth=8; o.strokeStyle=C.sel; o.stroke(); }
  }
  // labels: marked units first, then landmarks, then neighbours; never overlapping
  const placed=[];
  if(!far){ const ss=2.2; o.font='700 '+(12*ss)+'px "Assistant",sans-serif';
    for(const sp of KSPOTS){ const X=pxX(sp.c[0]), Y=pxY(sp.c[1]), w=o.measureText(sp.name).width;
      placed.push(sp.icon==='none'?{x0:X-w/2-3,y0:Y-6*ss-2,x1:X+w/2+3,y1:Y+6*ss+2}
        :{x0:X-(sp.icon==='house'?10:8)*ss-w-3, y0:Y-6*ss-2, x1:X+5*ss, y1:Y+6*ss+2}); } }
  o.textAlign='center'; o.textBaseline='middle';
  function label(text,X,Y,size,weight,fill,lw){
    o.font=weight+' '+size+'px "Assistant",sans-serif';
    const w=o.measureText(text).width, bx={x0:X-w/2-3,y0:Y-size/2-2,x1:X+w/2+3,y1:Y+size/2+2};
    if(bx.x0<2||bx.x1>mapW-2||bx.y0<headerH+2||bx.y1>headerH+mapH-2) return;
    for(const p of placed) if(!(bx.x1<p.x0||bx.x0>p.x1||bx.y1<p.y0||bx.y0>p.y1)) return;
    placed.push(bx); o.lineWidth=lw; o.strokeStyle=C.panel; o.strokeText(text,X,Y); o.fillStyle=fill; o.fillText(text,X,Y);
  }
  const nameOf=f=>labelMode==='num'?(f.num||f.name||''):(f.name||(f.num?('#'+f.num):''));
  const sel=F.filter(f=>selected.has(f.id) && !f.anchor);
  if(!far || sel.length<=4) for(const f of sel){ const t=nameOf(f); if(t) label(far?shortLabel(t):t, pxX(f.c[0]), pxY(f.c[1]), far?28:32, 800, C.sel, 7); }
  for(const f of anchorsByPriority()){
    if(far && ZOOMED_IN_ONLY.has(f.anchor) && !selected.has(f.id)) continue;
    label(f.anchor, pxX(f.c[0]), pxY(f.c[1]), far?26:30, 800, selected.has(f.id)?C.sel:C.anchorInk, 7);
  }
  if(!far) for(const f of F){ if(f.anchor || selected.has(f.id)) continue; const t=nameOf(f); if(t) label(shortLabel(t), pxX(f.c[0]), pxY(f.c[1]), 24, 700, C.ink, 5.5); }
  o.restore();
  o.strokeStyle=C.line; o.lineWidth=1; o.strokeRect(0.5,headerH+0.5,mapW-1,mapH-1);
  // credits footer (required by the OSM and Overture licences)
  o.direction='ltr'; o.textAlign='left'; o.textBaseline='middle'; o.fillStyle=C.muted;
  o.font='600 17px "Assistant",sans-serif'; o.fillText(ATTR, 16, headerH+mapH+footH/2);
  return oc;
}
/* red caption band; the message starts at y=200 so a phone's camera cutout never covers it */
function captionBand(o,W,caption,measureOnly){
  const CAP_FONT='800 56px "Assistant",sans-serif', CAP_LH=70, HEAD_FONT='800 40px "Assistant",sans-serif', HEAD_Y=96, MSG_Y=200;
  let lines=[];
  if(caption){ o.font=CAP_FONT; lines=wrapLines(o,caption,W-72); }
  const h=caption?(MSG_Y+lines.length*CAP_LH+24):0;
  if(measureOnly) return h;
  const C=colors(); o.direction='rtl';
  if(caption){
    o.fillStyle=C.accent; o.fillRect(0,0,W,h);
    o.fillStyle='#fff'; o.textAlign='right'; o.textBaseline='top';
    o.font=HEAD_FONT; o.fillText('🔔 הודעה', W-40, HEAD_Y);
    o.font=CAP_FONT; let y=MSG_Y; for(const ln of lines){ o.fillText(ln,W-40,y); y+=CAP_LH; }
  } else { o.fillStyle=C.accent; o.fillRect(0,0,W,6); }
  return h;
}
function wrapLines(c,text,maxW){
  const out=[];
  for(const para of text.split('\n')){ const words=para.split(' '); let line='';
    for(const wd of words){ const test=line?line+' '+wd:wd;
      if(c.measureText(test).width>maxW && line){ out.push(line); line=wd; } else line=test; }
    out.push(line); }
  return out;
}

matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
window.addEventListener('resize',()=>{ DPR=Math.min(window.devicePixelRatio||1,2.5); resize(); });
if(window.ResizeObserver) new ResizeObserver(()=>resize()).observe(canvas);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>draw());
resize();
};
